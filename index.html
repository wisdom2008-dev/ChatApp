}



    /* =========================
       ONLINE / OFFLINE PRESENCE
    ========================= */

    const PRESENCE_TIMEOUT = 60000;

    function isUserOnline(profile) {
      if (!profile || !profile.last_seen) {
        return false;
      }

      const lastSeen =
        new Date(profile.last_seen).getTime();

      return (
        Date.now() - lastSeen <
        PRESENCE_TIMEOUT
      );
    }

    async function updateMyPresence() {
      if (!currentUser) {
        return;
      }

      const result =
        await db
          .from("profiles")
          .update({
            last_seen: new Date().toISOString()
          })
          .eq("id", currentUser.id);

      if (result.error) {
        console.log(
          "Presence update error:",
          result.error
        );
      }
    }

    let presenceInterval = null;
    let profileRefreshInterval = null;

    function startPresence() {
      updateMyPresence();

      if (presenceInterval) {
        clearInterval(presenceInterval);
      }

      if (profileRefreshInterval) {
        clearInterval(profileRefreshInterval);
      }

      presenceInterval =
        setInterval(
          updateMyPresence,
          20000
        );

        setInterval(

                profiles.find(
                  function(profile) {
                    return (
                      profile.id ===
                      selectedContact.id
                    );
                  }
                );

              if (updatedContact) {
                selectedContact =
                  updatedContact;

                const name =
                  updatedContact.name ||
                  updatedContact.username ||
                  updatedContact.email ||
                  "User";

                const statusText =
                  isUserOnline(updatedContact)
                    ? "● Online"
                    : "● Offline";

                const title =
                  chatHeader.querySelector(
                    ".chat-title"
                  );

                const status =
                  chatHeader.querySelector(
                    ".chat-status"
                  );

                if (title) {
                  title.textContent = name;
                }

                if (status) {
                  status.textContent =
                    statusText;

                  status.className =
                    "chat-status " +
                    (isUserOnline(updatedContact)
                      ? "online"
                      : "offline");
                }
              }
            }
          },
          15000
        );
    }

    document.addEventListener(
      "visibilitychange",
      function() {
        if (
          document.visibilityState ===
          "visible"
        ) {
          updateMyPresence();
        }
      }
    );

    window.addEventListener(
      "focus",
      function() {
        updateMyPresence();
      }
    );


    /* =========================
       SHOW APP
    ========================= */

    async function showApp() {

      authScreen.style.display =
        "none";

      app.style.display =
        "block";

      await createProfileIfNeeded();

      await loadProfiles();

      subscribeToMessages();

      startPresence();

    }


    /* =========================
       LOAD PROFILES
    ========================= */

    async function loadProfiles() {

      const result =
        await db
          .from("profiles")
          .select("*")
          .order("username");

      if (result.error) {

        console.log(
          "Profiles error:",
          result.error
        );

        contacts.innerHTML =
          '<div style="padding:20px;">Unable to load contacts.</div>';

        return;

      }

      profiles =
        result.data || [];

      renderContacts();

    }


    /* =========================
       RENDER CONTACTS
    ========================= */

    function renderContacts(
      filter = ""
    ) {

      contacts.innerHTML = "";

      const search =
        filter.toLowerCase();

      const otherProfiles =
        profiles.filter(
          function(profile) {

            if (
              currentUser &&
              profile.id === currentUser.id
            ) {

              return false;

            }

            const username =
              profile.username || "";

            return username
              .toLowerCase()
              .includes(search);

          }
        );


      if (otherProfiles.length === 0) {

        contacts.innerHTML =
          '<div style="padding:20px;color:#777;">No contacts found.</div>';

        return;

      }


      otherProfiles.forEach(
        function(profile) {

          const contact =
            document.createElement("div");

          contact.className =
            "contact";

          contact.dataset.id =
            profile.id;

          const name =
  profile.name ||
  profile.username ||
  profile.email ||
  "User";

          const firstLetter =
            name
              .charAt(0)
              .toUpperCase();

          contact.innerHTML =

            '<div class="contact-left">' +

              '<div class="avatar">' +
                escapeHTML(firstLetter) +
              '</div>' +

              '<div>' +

                '<div class="contact-name">' +
                  escapeHTML(name) +
                '</div>' +

                '<div class="' +
                  (isUserOnline(profile) ? 'online' : 'online offline') +
                  '">' +
                  (isUserOnline(profile) ? '● Online' : '● Offline') +
                '</div>' +

              '</div>' +

            '</div>' +

            '<span class="badge">0</span>';


          contact.addEventListener(
            "click",
            async function() {

              await selectContact(
                profile
              );

            }
          );


          contacts.appendChild(
            contact
          );

        }
      );


      updateActiveContact();

    }


    /* =========================
       SELECT CONTACT
    ========================= */

    async function selectContact(
      profile
    ) {

      selectedContact =
        profile;
document.querySelector(".chat-area").classList.add("open");
      updateActiveContact();

      const name =
        profile.name ||
        profile.username ||
        profile.email ||
        "User";

      const firstLetter =
        name
          .charAt(0)
          .toUpperCase();

      const statusText =
        isUserOnline(profile)
          ? "● Online"
          : "● Offline";

      chatHeader.innerHTML =
  '<button id="backButton" class="back-button">←</button>' +

        '<div class="avatar">' +
          escapeHTML(firstLetter) +
        '</div>' +

        '<div>' +

          '<div class="chat-title">' +
            escapeHTML(name) +
          '</div>' +

          '<div class="chat-status ' +
            (isUserOnline(profile) ? 'online' : 'offline') +
            '">' +
            escapeHTML(statusText) +
          '</div>' +

        '</div>';
         document.getElementById("backButton").addEventListener("click", function() {
  document.querySelector(".chat-area").classList.remove("open");
});
      messageInputArea.style.display =
        "flex";

      messageInput.focus();

      await loadConversation();

    }


    /* =========================
       ACTIVE CONTACT
    ========================= */

    function updateActiveContact() {

      const allContacts =
        document.querySelectorAll(
          ".contact"
        );

      allContacts.forEach(
        function(contact) {

          if (
            selectedContact &&
            contact.dataset.id ===
            selectedContact.id
          ) {

            contact.classList.add(
              "active"
            );

          } else {

            contact.classList.remove(
              "active"
            );

          }

        }
      );

    }
          /* =========================
       LOAD CONVERSATION
    ========================= */

    async function loadConversation() {

      if (
        !currentUser ||
        !selectedContact
      ) {
        return;
      }

      messages.innerHTML = "";

      const result =
        await db
          .from("Messages")
          .select("*")
          .or(
            "and(sender_id.eq." +
            currentUser.id +
            ",receiver_id.eq." +
            selectedContact.id +
            "),and(sender_id.eq." +
            selectedContact.id +
            ",receiver_id.eq." +
            currentUser.id +
            ")"
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

      if (result.error) {

        console.log(
          "Messages error:",
          result.error
        );

        messages.innerHTML =
          '<div class="empty"><p>Unable to load messages.</p></div>';

        return;
      }

      if (
        !result.data ||
        result.data.length === 0
      ) {

        messages.innerHTML =
          '<div class="empty"><div><h3>No messages yet.</h3><p>Send the first message.</p></div></div>';

        return;
      }

      result.data.forEach(
        function(row) {
          displayMessage(row);
        }
      );

      scrollMessages();

    }


    /* =========================
       DISPLAY MESSAGE
    ========================= */

    function displayMessage(row) {

      const isSent =
        currentUser &&
        row.sender_id ===
        currentUser.id;

      const message =
        document.createElement("div");

      message.className =
        isSent
          ? "message sent"
          : "message received";

      message.dataset.id =
        row.id;

      const time =
        row.created_at
          ? new Date(
              row.created_at
            ).toLocaleTimeString(
              [],
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            )
          : "";

      let html =
        escapeHTML(
          row.content || ""
        ) +
        '<span class="time">' +
          escapeHTML(time) +
        '</span>';

      if (isSent) {

        html +=
          '<button class="delete">' +
            'Delete' +
          '</button>';

      }

      message.innerHTML =
        html;


      if (isSent) {

        const deleteButton =
          message.querySelector(
            ".delete"
          );

        deleteButton.addEventListener(
          "click",
          function() {

            deleteMessage(
              row.id
            );

          }
        );

      }

      messages.appendChild(
        message
      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const messageText =
        messageInput.value.trim();

      if (!messageText) {
        return;
      }

      if (
        !currentUser ||
        !selectedContact
      ) {

        alert(
          "Please select a contact first."
        );

        return;

      }

      sendButton.disabled =
        true;

      const result =
        await db
          .from("Messages")
          .insert({
            sender_id:
              currentUser.id,

            receiver_id:
              selectedContact.id,

            content:
              messageText
          })
          .select()
          .single();


      if (result.error) {

        console.log(
          "Send message error:",
          result.error
        );

        alert(
          result.error.message
        );

        sendButton.disabled =
          false;

        return;

      }

      messageInput.value = "";

      const existing =
        messages.querySelector(
          '[data-id="' +
          result.data.id +
          '"]'
        );

      if (!existing) {

        const empty =
          messages.querySelector(
            ".empty"
          );

        if (empty) {
          empty.remove();
        }

        displayMessage(
          result.data
        );

      }

      scrollMessages();

      sendButton.disabled =
        false;

    }


    /* =========================
       SEND BUTTON
    ========================= */

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    /* =========================
       ENTER TO SEND
    ========================= */

    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       DELETE MESSAGE
    ========================= */

    async function deleteMessage(
      messageId
    ) {

      const confirmed =
        confirm(
          "Delete this message?"
        );

      if (!confirmed) {
        return;
      }

      const result =
        await db
          .from("Messages")
          .delete()
          .eq(
            "id",
            messageId
          );

      if (result.error) {

        console.log(
          "Delete error:",
          result.error
        );

        alert(
          result.error.message
        );

        return;

      }

      const element =
        messages.querySelector(
          '[data-id="' +
          messageId +
          '"]'
        );

      if (element) {
        element.remove();
      }

    }


    /* =========================
       REALTIME
    ========================= */

    function subscribeToMessages() {

      if (realtimeChannel) {

        db.removeChannel(
          realtimeChannel
        );

      }

      realtimeChannel =
        db
          .channel(
            "chat-messages-" +
            Date.now()
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "Messages"
            },
            function(payload) {

              const row =
                payload.new;

              if (
                !currentUser ||
                !selectedContact
              ) {
                return;
              }

              const belongsToConversation =

                (
                  row.sender_id ===
                  currentUser.id &&

                  row.receiver_id ===
                  selectedContact.id
                )

                ||

                (
                  row.sender_id ===
                  selectedContact.id &&

                  row.receiver_id ===
                  currentUser.id
                );


              if (
                !belongsToConversation
              ) {
                return;
              }


              const alreadyDisplayed =
                messages.querySelector(
                  '[data-id="' +
                  row.id +
                  '"]'
                );


              if (
                alreadyDisplayed
              ) {
                return;
              }


              const empty =
                messages.querySelector(
                  ".empty"
                );

              if (empty) {
                empty.remove();
              }


              displayMessage(row);

              scrollMessages();

            }
          )
          .subscribe(
            function(status) {

              console.log(
                "Realtime status:",
                status
              );

            }
          );

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollMessages() {

      messages.scrollTop =
        messages.scrollHeight;

    }


    /* =========================
       SEARCH
    ========================= */

    searchInput.addEventListener(
      "input",
      function() {

        renderContacts(
          searchInput.value
        );

      }
    );


    /* =========================
       SETTINGS
    ========================= */

    settingsButton.addEventListener(
      "click",
      function() {

        settings.style.display =
          settings.style.display ===
          "block"
            ? "none"
            : "block";

      }
    );


    closeSettings.addEventListener(
      "click",
      function() {

        settings.style.display =
          "none";

      }
    );


    /* =========================
       EDIT PROFILE
    ========================= */

    editProfileButton.addEventListener(
      "click",
      async function() {

        const result =
          await db
            .from("profiles")
            .select("name, username")
            .eq("id", currentUser.id)
            .single();

        if (result.error) {
          editProfileMessage.textContent =
            result.error.message;
          return;
        }

        editProfileName.value =
          result.data.name || "";

        editProfileUsername.value =
          result.data.username || "";

        editProfile.style.display =
          "block";

        settings.style.display =
          "none";

      }
    );


    saveEditProfile.addEventListener(
      "click",
      async function() {

        const name =
          editProfileName.value.trim();

        const username =
          editProfileUsername.value.trim();

        if (!name || !username) {

          editProfileMessage.textContent =
            "Enter your name and username.";

          return;
        }

        if (!username.startsWith("@")) {

          editProfileMessage.textContent =
            "Username must start with @.";

          return;
        }

        editProfileMessage.textContent =
          "Saving...";

        const result =
          await db
            .from("profiles")
            .update({
              name: name,
              username: username
            })
            .eq("id", currentUser.id);

        if (result.error) {

          console.log(result.error);

          editProfileMessage.textContent =
            result.error.message;

          return;
        }

        editProfileMessage.textContent =
          "Profile saved!";

        editProfile.style.display =
          "none";

        await loadProfiles();

      }
    );


    cancelEditProfile.addEventListener(
      "click",
      function() {

        editProfile.style.display =
          "none";

        settings.style.display =
          "block";

      }
    );


    /* =========================
       DARK MODE
    ========================= */

    darkButton.addEventListener(
      "click",
      function() {

        document.body.classList.toggle(
          "dark"
        );

        if (
          document.body.classList.contains(
            "dark"
          )
        ) {

          localStorage.setItem(
            "darkMode",
            "true"
          );

          darkButton.textContent =
            "☀️ Light Mode";

        } else {

          localStorage.setItem(
            "darkMode",
            "false"
          );

          darkButton.textContent =
            "🌙 Dark Mode";

        }

      }
    );


    /* =========================
       LOAD DARK MODE
    ========================= */

    if (
      localStorage.getItem(
        "darkMode"
      ) === "true"
    ) {

      document.body.classList.add(
        "dark"
      );

      darkButton.textContent =
        "☀️ Light Mode";

    }


    /* =========================
       CLEAR MESSAGES
    ========================= */

    clearButton.addEventListener(
      "click",
      async function() {

        if (!currentUser) {
          return;
        }

        const confirmed =
          confirm(
            "Delete all messages you sent?"
          );

        if (!confirmed) {
          return;
        }

        const result =
          await db
            .from("Messages")
            .delete()
            .eq(
              "sender_id",
              currentUser.id
            );

        if (result.error) {

          console.log(
            "Clear error:",
            result.error
          );

          alert(
            result.error.message
          );

          return;

        }

        await loadConversation();

      }
    );


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async function() {

        const result =
          await db.auth.signOut();

        if (result.error) {

          console.log(
            result.error
          );

          return;

        }

        currentUser = null;

        selectedContact = null;

        profiles = [];

        if (realtimeChannel) {

          await db.removeChannel(
            realtimeChannel
          );

          realtimeChannel = null;

        }

        app.style.display =
          "none";

        authScreen.style.display =
          "flex";

        authEmail.value = "";

        authPassword.value = "";

        authMessage.textContent =
          "Logged out.";

        contacts.innerHTML = "";

        messages.innerHTML = "";

        messageInputArea.style.display =
          "none";

      }
    );


    /* =========================
       AUTH STATE
    ========================= */

    db.auth.onAuthStateChange(
      async function(event, session) {

        console.log(
          "Auth event:",
          event
        );

        if (
          session &&
          !currentUser
        ) {

          currentUser =
            session.user;

          await checkLogin();

        }

      }
    );


    /* =========================
       START
    ========================= */

    checkLogin();

  </script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (error) {
      console.log("Service worker registration failed:", error);
    });
  });
}
</script>
